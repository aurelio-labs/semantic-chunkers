name: Visionary review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Human pushes supersede an in-flight review. A push by the bot (the reviewer
# committing fixes) gets its own group so it never cancels the run that made it.
concurrency:
  group: visionary-review-${{ github.event.pull_request.number }}-${{ (github.actor == 'claude[bot]' || github.actor == 'github-actions[bot]') && github.run_id || 'human' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    uses: jamescalam/visionary/.github/workflows/review.yml@main
    with:
      # Prepare the toolchain the checks need. Runs before the agent.
      setup: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        uv sync --extra dev
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
