name: Visionary review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: visionary-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: jamescalam/visionary/.github/workflows/review.yml@main
    with:
      # Prepare the toolchain the checks need. Runs before the agent.
      setup: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        uv sync --extra dev
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
