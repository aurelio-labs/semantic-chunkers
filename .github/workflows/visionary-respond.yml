name: Visionary respond

# The responder answers every human comment on a PR or issue an agent opened,
# and any comment containing //vision anywhere else.
#
# The phrase is deliberately not an @-mention: GitHub links every @name to a
# real user, so it would notify a stranger, and @claude collides with the
# Claude GitHub App's own mention handling. //vision pings nobody.
#
# A single inline comment on the diff arrives as a submitted review whose body
# is empty, with the text in its inline comments — which a workflow expression
# cannot read. So this file only filters out the agents' own comments, and the
# reusable workflow's gate job decides whether the comment is for the role.

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: visionary-respond-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      github.event.sender.login != 'claude[bot]' &&
      github.event.sender.login != 'github-actions[bot]'
    uses: jamescalam/visionary/.github/workflows/respond.yml@main
    with:
      kind: ${{ (github.event_name != 'issue_comment' || github.event.issue.pull_request) && 'pr' || 'issue' }}
      number: ${{ github.event.pull_request.number || github.event.issue.number }}
      trigger_id: ${{ github.event_name == 'pull_request_review' && github.event.review.id || github.event.comment.id }}
      trigger_kind: ${{ github.event_name == 'pull_request_review' && 'review' || (github.event_name == 'pull_request_review_comment' && 'inline' || 'comment') }}
      head_ref: ${{ github.event.pull_request.head.ref || '' }}
      setup: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        uv sync --extra dev
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
